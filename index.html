<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Momo & Sam — Pernikahan">
  <title>Momo & Sam — Pernikahan</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>

  <!-- Audio Element (used to unlock audio on user gesture) -->
  <audio id="bg-music" loop preload="auto">
    <source src="assets/reze.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- OPENING SCREEN -->
  <div id="opening-screen">
    <div class="opening-buttons">
      <a href="id/index.html" class="language-button" data-lang="id">Buka</a>
      <a href="ja/index.html" class="language-button" data-lang="ja">招待状を開く</a>
      <a href="en/index.html" class="language-button" data-lang="en">Open</a>
    </div>
  </div>

  <script>
    document.querySelectorAll('.language-button').forEach(button => {
      button.addEventListener('click', function(e) {
        e.preventDefault();
        const targetUrl = this.getAttribute('href');
        const audio = document.getElementById('bg-music');

        // Remember that the user wants music
        sessionStorage.setItem('playMusic', 'true');

        // Try to start playback (this also "unlocks" audio for the origin
        // so the next page has a better chance of autoplaying)
        const playPromise = audio.play();

        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              // Give the browser a brief moment to actually start the audio
              // before navigating away
              setTimeout(() => {
                window.location.href = targetUrl;
              }, 150);
            })
            .catch(() => {
              // Autoplay was blocked – still navigate
              window.location.href = targetUrl;
            });
        } else {
          window.location.href = targetUrl;
        }
      });
    });
  </script>

</body>
</html>
